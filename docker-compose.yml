services:
  app:
    build: .
    container_name: sensei-app
    restart: always
    extra_hosts:
      - "data.tdcc.com.tw:${TDCC_IP:-117.56.213.165}"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
    ports:
      - "127.0.0.1:8503:8501"
    volumes:
      - .:/app
    command: streamlit run src/app.py --server.port 8501 --server.address 0.0.0.0

  intraday:
    build: .
    container_name: sensei-intraday
    restart: always
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
    volumes:
      - .:/app
    command: python src/intraday_sync.py

  db:
    image: postgres:14
    container_name: sensei-db
    restart: always
    # 只給 postgres 必要變數(由 compose 自動讀取 .env 做變數代換),不灌入其他 API 金鑰
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-sensei_db}
    # 只綁本機，避免資料庫曝露到區網(app 仍可透過 docker 內部網路以 db:5432 連線)
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
